[package]
name = "mona-flex"
version = "0.1.0"
description = "MONA Flex docked chat"
authors = ["MONAS"]
edition = "2021"

[lib]
name = "mona_flex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
